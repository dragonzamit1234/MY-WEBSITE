<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body {font-family:Arial;background:#f2f2f2;height:100vh;display:flex;justify-content:center;align-items:center;}
        .box {width:300px;background:white;padding:20px;border-radius:10px;box-shadow:0 0 10px gray;}
        input,button {width:100%;padding:10px;margin-top:10px;}
        button {background:blue;color:white;border:none;}
        .link {text-align:center;margin-top:10px;}
    </style>
</head>
<body>

<div class="box">
    <h2>Login</h2>
    <input id="user" type="text" placeholder="Username">
    <input id="pass" type="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <div class="link">
        <a href="register.html">Create an account</a>
    </div>

    <p id="err" style="color:red;"></p>
</div>

<script>
function login() {
    let u = document.getElementById("user").value;
    let p = document.getElementById("pass").value;

    let accounts = JSON.parse(localStorage.getItem("accounts") || "{}");

    if (accounts[u] && accounts[u] === p) {
        localStorage.setItem("currentUser", u);
        window.location.href = "dashboard.html";
    } else {
        document.getElementById("err").innerHTML = "Invalid username or password!";
    }
}
</script>

</body>
</html>
